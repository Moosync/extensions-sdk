[package]
name = "extensions-sdk-deps"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
path = "wasm-extension-rs/examples/src/lib.rs"

# This manifest exists solely for Bazel crate_universe dependency resolution.
# Do not build this crate directly with Cargo.

[dependencies]
extism-convert = "1.12.0"
extism-pdk = "1.3.0"
lazy_static = "1.5.0"
prost = "0.14"
prost-types = { version = "0.14", default-features = false }
protoc-gen-prost = "0.3.1"
serde = "1.0.219"
serde_json = "1.0.145"
tokio = { version = "1.48.0", default-features = false, features = ["rt", "time", "sync", "macros"] }
tracing = { version = "0.1.41", default-features = false, features = ["attributes"] }
